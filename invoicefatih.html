<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Invoice Material Alam</title>

    <!-- LIBRARY HTML2PDF (Wajib untuk export PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        .form-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-add { background-color: #28a745; }
        .btn-update { background-color: #ffc107; color: #000; display: none; }
        .btn-danger { background-color: #dc3545; }
        #invoice-preview {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .kop-surat img {
            width: 100%;
            max-height: 120px;
            object-fit: contain;
        }
        .invoice-title {
            text-align: center;
            margin: 20px 0;
        }
        .invoice-title h2 {
            font-size: 18px;
            margin: 0;
        }
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .invoice-table th, .invoice-table td {
            border: 1px solid #333;
            padding: 8px;
            font-size: 13px;
        }
        .invoice-table th {
            background-color: #f2f2f2;
            text-align: center;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .signature-section {
            margin-top: 40px;
            display: flex;
            justify-content: flex-end;
        }
        .btn-sm {
            padding: 3px 8px;
            font-size: 11px;
            margin: 0 2px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: white;
        }
        .btn-edit { background-color: #ffc107; color: #000; }
        .btn-delete { background-color: #dc3545; }
        @media print {
            .form-card, .no-print { display: none !important; }
            body { background: white; padding: 0; }
            #invoice-preview { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- FORM INPUT DATA -->
    <div class="form-card">
        <h2 id="formTitle">Input Data Barang</h2>
        <input type="hidden" id="editKey" value="">
        
        <div class="form-group">
            <input type="date" id="inputTgl" style="font-family: 'Arial Black', sans-serif; font-weight: bold;">
            <input type="text" id="inputPlat" placeholder="Plat Nomor" style="font-family: 'Arial Black', sans-serif; font-weight: bold;">
            <input type="text" id="inputNamaBarang" placeholder="Nama Barang" oninput="cekHargaOtomatis(this.value)" style="font-family: 'Arial Black', sans-serif; font-weight: bold;">
            <input type="number" id="inputVolume" placeholder="Vol" min="1" step="any" style="font-family: 'Arial Black', sans-serif; font-weight: bold;">
            <input type="text" inputmode="numeric" id="inputHarga" placeholder="Harga Satuan (Rp)" oninput="formatInputRupiah(this)" style="font-family: 'Arial Black', sans-serif; font-weight: bold;">
        </div>
        
        <button class="btn btn-add" id="btnAdd" onclick="tambahBarang()">+ Tambah Baris Data</button>
        <button class="btn btn-update" id="btnUpdate" onclick="updateBarang()">💾 Simpan Perubahan</button>
        <button class="btn" style="background-color: #6c757d; font-size: 14px; margin-left: 5px; display:none;" id="btnCancel" onclick="resetForm()">Batal</button>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px;">
            <button class="btn" style="background-color: #007bff; font-size: 14px;" onclick="generatePDF('BBS')">
                📄 Download PERTAMA FATIH
            </button>
            <button class="btn" style="background-color: #ed4242; font-size: 14px;" onclick="generatePDF('CHM')">
                📄 Download KEDUA CHM
            </button>
            <!-- MENU HAPUS TOTAL -->
            <button class="btn btn-danger" style="font-size: 14px;" onclick="hapusSemuaBarang()">
                🗑️ Hapus Total Data
            </button>
        </div>
    </div>

    <!-- PREVIEW INVOICE / AREA PDF -->
    <div id="invoice-preview">
        <!-- KOP SURAT -->
        <div class="kop-surat">
            <img src="kop.jpeg" alt="KOP Surat" class="kop-img">
        </div>

        <div class="invoice-title">
            <h2>INVOICE KIRIMAN MATERIAL ALAM TUJUAN<br>PT. CAHAYA HARTA MAKMUR</h2>
        </div>

        <!-- TABEL BARANG -->
        <table class="invoice-table">
            <thead>
                <tr>
                    <th style="width: 5%;">NO</th>
                    <th style="width: 8%;">TGL</th>
                    <th style="width: 13%;">NAMA BARANG</th>
                    <th style="width: 10%;">PLAT NOMOR</th>
                    <th style="width: 10%;">VOL (M³)</th>
                    <th style="width: 10%;">HARGA /M³</th>
                    <th style="width: 10%;">JUMLAH</th>
                    <th style="width: 13%;" class="no-print">AKSI</th>
                </tr>
            </thead>
            <tbody id="invoiceItems">
                <!-- Data barang dari Firebase akan muncul di sini -->
            </tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="4" class="text-center"><strong>TOTAL KESELURUHAN</strong></td>
                    <td id="totalVolume" class="text-center"><strong>0 M³</strong></td>
                    <td></td>
                    <td id="totalKeseluruhan" class="text-right" colspan="2"><strong>Rp 0</strong></td>
                </tr>
            </tfoot>
        </table>

        <!-- TANDA TANGAN -->
        <div class="signature-section">
            <div class="signature-box" style="text-align: center;">
                <p style="margin: 0 0 2px 0;">Cilegon, <span id="currentDate"></span></p>
                <p style="font-weight: bold; margin: 0;">Direktur Utama</p>
                <div class="signature-wrapper" style="min-height: 80px; display: flex; align-items: center; justify-content: center; margin: 4px 0;">
                    <img src="cap.png" alt="Tanda Tangan Direktur" class="signature-img" style="display: block; margin: 0 auto; max-height: 65px; height: auto; width: auto;">
                </div>
                <p style="font-weight: bold; margin: 2px 0 0 0;">H. HENDAR WAHBAGIONO</p>
            </div>
        </div>
    </div>
</div>

<!-- FIREBASE INTEGRATION SCRIPT -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyA_wvEsCCOEjiwxui7_pdOrG8-xMBCw3mw",
        authDomain: "barcode-warung-81e97.firebaseapp.com",
        databaseURL: "https://barcode-warung-81e97-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "barcode-warung-81e97",
        storageBucket: "barcode-warung-81e97.firebasestorage.app",
        messagingSenderId: "1089837830503",
        appId: "1:1089837830503:web:410644c17a04314e37dfc2",
        measurementId: "G-92V3E8BM6J"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'invoiceItems');

    let dataBarang = [];

    // Set tanggal hari ini di TTD
    const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    const elDateInit = document.getElementById('currentDate');
    if (elDateInit) elDateInit.innerText = today;

    // Mendengarkan perubahan data secara Real-time dari Firebase
    onValue(dbRef, (snapshot) => {
        dataBarang = [];
        if (snapshot.exists()) {
            const data = snapshot.val();
            for (let key in data) {
                dataBarang.push({
                    key: key,
                    ...data[key]
                });
            }
        }
        renderTable();
    });

    // Otomatisasi harga berdasarkan nama barang
    window.cekHargaOtomatis = function(namaBarang) {
        const inputHarga = document.getElementById('inputHarga');
        if (!inputHarga) return;
        const text = namaBarang.trim().toLowerCase();

        if (text === 'split 1.2' || text === 'split 1/2' || text === 'split 1.2 ') {
            inputHarga.value = '362,500';
        } else if (text === 'screning' || text === 'screening') {
            inputHarga.value = '297,500';
        } else if (text === 'abu batu') {
            inputHarga.value = '262,500';
        }
    };

    // Format Rupiah Input
    window.formatInputRupiah = function(input) {
        let value = input.value.replace(/\D/g, '');
        if (value) {
            input.value = parseInt(value, 10).toLocaleString('en-US');
        } else {
            input.value = '';
        }
    };

    // Format angka ke Rupiah
    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
    }

    // Tambah Barang (Simpan ke Firebase)
    window.tambahBarang = function() {
        const tgl = document.getElementById('inputTgl').value;
        const plat = document.getElementById('inputPlat').value;
        const nama = document.getElementById('inputNamaBarang').value;
        const vol = parseFloat(document.getElementById('inputVolume').value) || 0;
        
        const rawHarga = document.getElementById('inputHarga').value.replace(/,/g, '');
        const harga = parseFloat(rawHarga) || 0;

        if (!tgl || !nama || vol <= 0 || harga <= 0) {
            alert("Harap isi semua bidang input dengan benar!");
            return;
        }

        const jumlah = vol * harga;
        const newItem = { tgl, nama, plat, vol, harga, jumlah };

        // Push data baru ke Firebase Database
        push(dbRef, newItem)
            .then(() => {
                clearForm();
            })
            .catch((err) => {
                alert("Gagal menambahkan data: " + err.message);
            });
    };

    // Load data ke form untuk Edit
    window.editBarang = function(key) {
        const item = dataBarang.find(d => d.key === key);
        if (!item) return;

        document.getElementById('inputTgl').value = item.tgl;
        document.getElementById('inputPlat').value = item.plat;
        document.getElementById('inputNamaBarang').value = item.nama;
        document.getElementById('inputVolume').value = item.vol;
        document.getElementById('inputHarga').value = item.harga.toLocaleString('en-US');
        
        document.getElementById('editKey').value = key;
        document.getElementById('formTitle').innerText = "Edit Data Barang";
        
        document.getElementById('btnAdd').style.display = 'none';
        document.getElementById('btnUpdate').style.display = 'inline-block';
        document.getElementById('btnCancel').style.display = 'inline-block';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Update barang yang ada di Firebase
    window.updateBarang = function() {
        const key = document.getElementById('editKey').value;
        if (!key) return;

        const tgl = document.getElementById('inputTgl').value;
        const plat = document.getElementById('inputPlat').value;
        const nama = document.getElementById('inputNamaBarang').value;
        const vol = parseFloat(document.getElementById('inputVolume').value) || 0;
        
        const rawHarga = document.getElementById('inputHarga').value.replace(/,/g, '');
        const harga = parseFloat(rawHarga) || 0;

        if (!tgl || !nama || vol <= 0 || harga <= 0) {
            alert("Harap isi semua bidang input dengan benar!");
            return;
        }

        const jumlah = vol * harga;
        const itemRef = ref(db, `invoiceItems/${key}`);

        set(itemRef, { tgl, nama, plat, vol, harga, jumlah })
            .then(() => {
                resetForm();
            })
            .catch((err) => {
                alert("Gagal memperbarui data: " + err.message);
            });
    };

    // Hapus 1 baris barang dari Firebase
    window.hapusBarang = function(key) {
        if (confirm("Yakin ingin menghapus baris data ini?")) {
            const itemRef = ref(db, `invoiceItems/${key}`);
            remove(itemRef).catch((err) => {
                alert("Gagal menghapus data: " + err.message);
            });
        }
    };

    // Hapus SEMUA data dari Firebase (Menu Hapus Total)
    window.hapusSemuaBarang = function() {
        if (confirm("⚠️ YAKIN INGIN MENGHAPUS SEMUA DATA INVOICE?\nData yang dihapus tidak dapat dikembalikan!")) {
            remove(dbRef)
                .then(() => {
                    alert("Seluruh data invoice berhasil dikosongkan.");
                    resetForm();
                })
                .catch((err) => {
                    alert("Gagal mengosongkan data: " + err.message);
                });
        }
    };

    // Clear Form
    function clearForm() {
        document.getElementById('inputTgl').value = '';
        document.getElementById('inputPlat').value = '';
        document.getElementById('inputNamaBarang').value = '';
        document.getElementById('inputVolume').value = '';
        document.getElementById('inputHarga').value = '';
    }

    // Reset Status Form
    window.resetForm = function() {
        clearForm();
        document.getElementById('editKey').value = '';
        document.getElementById('formTitle').innerText = "Input Data Barang";
        document.getElementById('btnAdd').style.display = 'inline-block';
        document.getElementById('btnUpdate').style.display = 'none';
        document.getElementById('btnCancel').style.display = 'none';
    };

    // Render Tabel dari array dataBarang dengan kalkulasi volume yang presisi
    function renderTable() {
        const tbody = document.getElementById('invoiceItems');
        if (!tbody) return;
        tbody.innerHTML = '';
        
        let totalVol = 0;
        let totalHarga = 0;

        dataBarang.forEach((item, index) => {
            // Konversi nilai volume & harga ke Float agar tidak terjadi kesalahan penjumlahan string/desimal
            const vol = parseFloat(item.vol) || 0;
            const harga = parseFloat(item.harga) || 0;
            const jumlah = parseFloat(item.jumlah) || (vol * harga);

            totalVol += vol;
            totalHarga += jumlah;

            let tglFormatted = item.tgl;
            if (item.tgl) {
                const parts = item.tgl.split('-');
                if (parts.length === 3) {
                    tglFormatted = `${parseInt(parts[2], 10)}/${parseInt(parts[1], 10)}/${parts[0]}`;
                }
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-center">${index + 1}</td>
                <td class="text-center">${tglFormatted}</td>
                <td>${item.nama}</td>
                <td class="text-center">${item.plat || '-'}</td>
                <td class="text-center">${vol.toLocaleString('id-ID')}</td>
                <td class="text-right">${formatRupiah(harga)}</td>
                <td class="text-right">${formatRupiah(jumlah)}</td>
                <td class="text-center no-print">
                    <button class="btn-sm btn-edit" onclick="editBarang('${item.key}')">Edit</button>
                    <button class="btn-sm btn-delete" onclick="hapusBarang('${item.key}')">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Pemformatan total volume yang rapi (menghilangkan kelebihan koma desimal float)
        const totalVolFormatted = Number(totalVol.toFixed(3)).toLocaleString('id-ID');
        document.getElementById('totalVolume').innerHTML = `<strong>${totalVolFormatted} M³</strong>`;
        document.getElementById('totalKeseluruhan').innerHTML = `<strong>${formatRupiah(totalHarga)}</strong>`;
    }

    // Fungsi Cetak / Download PDF
   window.generatePDF = function(model) {
    if (dataBarang.length === 0) {
        alert("Tambahkan minimal 1 data barang sebelum men-download PDF!");
        return;
    }

    // Sembunyikan kolom aksi
    const actionCells = document.querySelectorAll('.no-print');
    actionCells.forEach(el => el.style.display = 'none');

    const hariIni = new Date();
    const opsiTanggal = { day: 'numeric', month: 'long', year: 'numeric' };
    const tanggalFormatted = hariIni.toLocaleDateString('id-ID', opsiTanggal);

    const elDate = document.getElementById('currentDate');
    if (elDate) {
        elDate.innerText = tanggalFormatted;
    }

    const kopElement = document.querySelector('.kop-surat');
    const invoicePreview = document.getElementById('invoice-preview');
    const signatureImg = document.querySelector('.signature-img');

    let namaFile = '';

    const yyyy = hariIni.getFullYear();
    const mm = String(hariIni.getMonth() + 1).padStart(2, '0');
    const dd = String(hariIni.getDate()).padStart(2, '0');
    const tglFormat = `${dd}-${mm}-${yyyy}`;

    if (model === 'BBS') {
        if (kopElement) kopElement.style.display = 'none';
        if (signatureImg) {
            signatureImg.src = 'ttd.png';
            signatureImg.style.maxHeight = '90px';
            signatureImg.style.maxWidth = '220px';
            signatureImg.style.height = 'auto';
            signatureImg.style.width = 'auto';
            signatureImg.style.objectFit = 'contain';
            signatureImg.style.transform = 'none';
        }
        namaFile = `1. Invoice FATIH - ${tglFormat}.pdf`;
    } else {
        if (kopElement) kopElement.style.display = 'block';
        if (signatureImg) {
            signatureImg.src = 'cap.png';
            signatureImg.style.maxHeight = '65px';
            signatureImg.style.height = 'auto';
            signatureImg.style.width = 'auto';
            signatureImg.style.objectFit = 'contain';
            signatureImg.style.transform = 'none';
        }
        namaFile = `2. Invoice CHM - ${tglFormat}.pdf`;
    }

    // Simpan gaya asli elemen
    const originalWidth = invoicePreview.style.width;
    const originalPadding = invoicePreview.style.padding;
    const originalBoxSizing = invoicePreview.style.boxSizing;

    // Set ukuran ideal A4 Portrait dengan border-box agar padding tidak melebarkan wadah
    invoicePreview.style.boxSizing = 'border-box';
    invoicePreview.style.width = '750px';
    invoicePreview.style.padding = '15px';

    window.scrollTo(0, 0);

    const opt = {
        margin:       [5, 5, 5, 5],
        filename:     namaFile,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { 
            scale: 2, 
            useCORS: true, 
            allowTaint: true, 
            scrollX: 0, 
            scrollY: 0
            // Parameter width sengaja dihapus agar tidak memotong kanvas di sebelah kanan
        },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
    };

    setTimeout(() => {
        html2pdf().set(opt).from(invoicePreview).save().then(() => {
            // Kembalikan gaya asli ke tampilan semula
            invoicePreview.style.width = originalWidth;
            invoicePreview.style.padding = originalPadding;
            invoicePreview.style.boxSizing = originalBoxSizing;

            actionCells.forEach(el => el.style.display = '');

            if (kopElement) kopElement.style.display = 'block';
            if (signatureImg) {
                signatureImg.src = 'cap.png';
                signatureImg.style.maxHeight = '85px';
                signatureImg.style.transform = 'none';
            }
        });
    }, 300);
};
</script>

</body>
</html>
