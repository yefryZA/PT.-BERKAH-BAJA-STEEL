<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Direksi - PT. BBS</title>

    <style>
        :root {
            --bg-main: #0b132b;
            --bg-card: #1c2541;
            --bg-hover: #232f52;
            --accent-gold: #d4af37;
            --text-light: #edf2f4;
            --text-muted: #8d99ae;
            --green: #2ecc71;
            --red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            padding: 12px;
            max-width: 600px; /* Dioptimalkan untuk lebar HP */
            margin: 0 auto;
        }

        /* Header Dashboard Mobile */
        .dashboard-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 16px;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-badge {
            background: rgba(46, 204, 113, 0.15);
            color: var(--green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--green);
            align-self: flex-start;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--green);
            border-radius: 50%;
            display: inline-block;
        }

        /* KPI Cards Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        /* Kartu Saldo Utama (Lebih Menonjol) */
        .kpi-card-main {
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            border-left: 5px solid var(--accent-gold);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* Sub KPI Grid (Masuk & Keluar Berdampingan) */
        .kpi-sub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .kpi-card {
            background-color: var(--bg-card);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .kpi-card.green { border-left: 4px solid var(--green); }
        .kpi-card.red { border-left: 4px solid var(--red); }

        .kpi-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .kpi-value-main {
            font-size: 24px;
            font-weight: 700;
        }

        .kpi-value {
            font-size: 16px;
            font-weight: 700;
        }

        .text-gold { color: var(--accent-gold); }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        /* Layout List Transaksi Berbasis Kartu */
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tx-card {
            background-color: var(--bg-card);
            border-radius: 10px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tx-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tx-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .type-masuk { background: rgba(46, 204, 113, 0.2); color: var(--green); }
        .type-keluar { background: rgba(231, 76, 60, 0.2); color: var(--red); }

        .tx-body {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 10px;
        }

        .tx-desc {
            font-size: 14px;
            color: var(--text-light);
            word-break: break-word;
            flex: 1;
            font-weight: 500;
        }

        .tx-amount {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 16px;
            background-color: var(--bg-card);
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="dashboard-header">
        <div class="header-top">
            <div class="header-title">
                <h1>EXECUTIVE FINANCIAL</h1>
                <p>PT. BERKAH BAJA STEEL (BBS)</p>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span> Realtime
            </div>
        </div>
    </div>

    <!-- Ringkasan Finansial (KPI Mobile) -->
    <div class="kpi-grid">
        <!-- Saldo Utama -->
        <div class="kpi-card-main">
            <div class="kpi-label">Saldo Kas Saat Ini</div>
            <div class="kpi-value-main text-gold" id="kpi-saldo">Rp 0</div>
        </div>
        
        <!-- Pemasukan & Pengeluaran (2 Kolom) -->
        <div class="kpi-sub-grid">
            <div class="kpi-card green">
                <div class="kpi-label">Pemasukan</div>
                <div class="kpi-value text-green" id="kpi-masuk">Rp 0</div>
            </div>
            <div class="kpi-card red">
                <div class="kpi-label">Pengeluaran</div>
                <div class="kpi-value text-red" id="kpi-keluar">Rp 0</div>
            </div>
        </div>
    </div>

    <!-- Rincian Transaksi -->
    <div>
        <div class="section-title">
            <span>Riwayat Transaksi</span>
            <span style="font-size: 12px; color: var(--text-muted);" id="total-count">0 Transaksi</span>
        </div>

        <div class="transaction-list" id="transaction-container">
            <div class="empty-state">
                Memuat data transaksi...
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA_wvEsCCOEjiwxui7_pdOrG8-xMBCw3mw",
            authDomain: "barcode-warung-81e97.firebaseapp.com",
            databaseURL: "https://barcode-warung-81e97-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "barcode-warung-81e97",
            storageBucket: "barcode-warung-81e97.firebasestorage.app",
            messagingSenderId: "1089837830503",
            appId: "1:1089837830503:web:410644c17a04314e37dfc2",
            measurementId: "G-92V3E8BM6J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRefKas = ref(db, "KAS_BBS");

        function formatRupiah(angka) {
            return "Rp " + Number(angka).toLocaleString('id-ID');
        }

        // Sinkronisasi Data Realtime
        onValue(dbRefKas, (snapshot) => {
            const data = snapshot.val();
            const transaksiData = data ? data : [];
            
            updateDashboard(transaksiData);
        });

        function updateDashboard(data) {
            let totalMasuk = 0;
            let totalKeluar = 0;

            const container = document.getElementById('transaction-container');
            container.innerHTML = "";

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        Belum ada data transaksi tercatat.
                    </div>
                `;
            } else {
                // Urutkan transaksi terbaru di posisi paling atas
                const reverseData = [...data].reverse();

                reverseData.forEach(item => {
                    const isMasuk = item.jenis === 'masuk';
                    if (isMasuk) totalMasuk += item.nominal;
                    else totalKeluar += item.nominal;

                    const txCard = document.createElement('div');
                    txCard.className = 'tx-card';
                    txCard.innerHTML = `
                        <div class="tx-header">
                            <span class="tx-date">${item.tgl}</span>
                            <span class="type-badge ${isMasuk ? 'type-masuk' : 'type-keluar'}">
                                ${isMasuk ? 'MASUK' : 'KELUAR'}
                            </span>
                        </div>
                        <div class="tx-body">
                            <div class="tx-desc">${item.ket}</div>
                            <div class="tx-amount ${isMasuk ? 'text-green' : 'text-red'}">
                                ${isMasuk ? '+' : '-'} ${formatRupiah(item.nominal)}
                            </div>
                        </div>
                    `;
                    container.appendChild(txCard);
                });
            }

            const totalSaldo = totalMasuk - totalKeluar;

            // Update Kartu KPI
            document.getElementById('kpi-saldo').innerText = formatRupiah(totalSaldo);
            document.getElementById('kpi-masuk').innerText = formatRupiah(totalMasuk);
            document.getElementById('kpi-keluar').innerText = formatRupiah(totalKeluar);
            document.getElementById('total-count').innerText = `${data.length} Transaksi`;
        }
    </script>
</body>
</html>
