<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Kasir - Barcode Warung</title>

    <!-- Library untuk Generate PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* Styling Halaman Utama */
        body { 
            font-family: Arial, sans-serif; 
            padding: 12px; 
            background-color: #009cb4; 
            margin: 0;
        }

        h2 { 
            color: #FFD700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6), 0 0 2px #000;
            margin-top: 5px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* Wrapper Utama */
        .main-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Tombol Download PDF */
        .btn-pdf-trigger {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #d50000;
            border: 2px solid #FFD700;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-sizing: border-box;
        }

        .btn-pdf-trigger:active {
            background-color: #f1f1f1;
        }

        /* Modal Styles untuk HP */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 999; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.7); 
            overflow-y: auto;
            padding: 16px 0;
            box-sizing: border-box;
        }

        .modal-content { 
            background: white; 
            margin: 5vh auto; 
            padding: 20px; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 400px; 
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            text-align: center; 
            box-sizing: border-box; 
        }

        #isiNotifTagihan {
            overflow-y: auto;
            flex: 1;
            padding-right: 6px;
            margin-bottom: 10px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .btn-modal { 
            width: 100%; 
            padding: 12px; 
            background: #ff1744; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            flex-shrink: 0;
        }

        .btn-simpan { 
            background: #2e7d32; 
        }

        input[type="text"], input[type="date"] { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* Container List Tagihan */
        #containerTagihan {
            width: 100%;
        }

        /* CARD TAGIHAN */
        .card-tagihan {
            background: #ea5858;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
        }

        .card-row-tanggal {
            width: 100%;
            font-size: 13px;
            color: #555;
            background-color: #f8f9fa;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-weight: bold;
        }

        .card-row-rincian {
            width: 100%;
            font-size: 17px;
            color: #222;
            line-height: 1.4;
            padding: 0 2px;
            margin-bottom: 12px;
            word-break: break-word;
            box-sizing: border-box;
        }

        .card-row-totalan {
            width: 100%;
            background-color: #fff8f8;
            border: 1px solid #ffe0e0;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .card-row-totalan .item-nominal {
            width: 100%;
            font-size: 14px;
            color: #333;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .card-row-totalan .item-nominal:last-child {
            margin-bottom: 0;
        }

        .card-row-totalan .text-sisa {
            color: #d50000;
            font-size: 15px;
            border-top: 1px dashed #ffd0d0;
            padding-top: 6px;
            margin-top: 6px;
        }

        .card-row-aksi {
            width: 100%;
        }

        .btn-bayar-full {
            width: 100%;
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-bayar-full:active {
            background-color: #0b5ed7;
        }

        .badge-pending-full {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #ffc107;
            color: #000;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            font-size: 13px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <h2>DAFTAR TAGIHAN PT. BERKAH BAJA STEEL</h2>

        <!-- Tombol Buka Pilihan Download PDF -->
        <button class="btn-pdf-trigger" onclick="bukaModalPDF()">
            📄 Download PDF Tagihan (Pilih Tanggal)
        </button>

        <!-- Container Utama Card Tagihan -->
        <div id="containerTagihan">
            <div style="text-align:center; padding: 20px; color: white;">Memuat data...</div>
        </div>
    </div>

    <!-- POP-UP PILIH TANGGAL DOWNLOAD PDF -->
    <div id="modalDownloadPDF" class="modal">
        <div class="modal-content" style="text-align: left;">
            <h3 style="margin-top:0; color:#009cb4;">📄 Download Laporan Tagihan PDF</h3>
            <p style="font-size: 13px; color: #555; margin-top: 0;">Pilih rentang tanggal tagihan yang akan dicetak ke PDF:</p>

            <label style="display:block; margin-top:10px; font-weight:bold; font-size:14px;">Dari Tanggal:</label>
            <input type="date" id="pdfTglMulai">

            <label style="display:block; margin-top:12px; font-weight:bold; font-size:14px;">Sampai Tanggal:</label>
            <input type="date" id="pdfTglAkhir">

            <button class="btn-modal btn-simpan" onclick="generatePDFTagihan()" style="margin-top: 18px;">
                ⬇️ Download PDF Sekarang
            </button>
            <button class="btn-modal" style="background:gray;" onclick="tutupModalPDF()">
                Batal
            </button>
        </div>
    </div>

    <!-- POP-UP BACA TAGIHAN BARU FOR KASIR -->
    <div id="popTagihanBaru" class="modal">
        <div class="modal-content">
            <h2 style="color: #ff1744; margin-top:0; margin-bottom:10px; text-shadow:none; flex-shrink:0;">⚠️ TAGIHAN BARU MASUK!</h2>
            <div id="isiNotifTagihan" style="font-size: 15px; text-align: left; line-height: 1.5;"></div>
            <button class="btn-modal" onclick="konfirmasiBacaTagihan()">Saya Sudah Baca & Mengerti</button>
        </div>
    </div>

    <!-- POP-UP INPUT BAYAR TAGIHAN -->
    <div id="modalBayarKasir" class="modal">
        <div class="modal-content" style="text-align: left;">
            <h3 style="margin-top:0;">💳 Input Pembayaran Tagihan</h3>
            <div id="infoDetailTagihan"></div>
            <label style="display:block; margin-top:15px; font-weight:bold;">Nominal Dibayar (Rp):</label>
            <input type="text" id="nominalBayarKasir" placeholder="0">
            <button class="btn-modal btn-simpan" onclick="prosesBayarKasir()">Simpan Pembayaran</button>
            <button class="btn-modal" style="background:gray;" onclick="tutupBayarModal()">Batal</button>
        </div>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA_wvEsCCOEjiwxui7_pdOrG8-xMBCw3mw",
        authDomain: "barcode-warung-81e97.firebaseapp.com",
        projectId: "barcode-warung-81e97",
        storageBucket: "barcode-warung-81e97.firebasestorage.app",
        messagingSenderId: "1089837830503",
        appId: "1:1089837830503:web:410644c17a04314e37dfc2",
        measurementId: "G-92V3E8BM6J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, "https://barcode-warung-81e97-default-rtdb.asia-southeast1.firebasedatabase.app/");

    let semuaTagihanAktif = []; // Menyimpan data tagihan aktif untuk keperluan filter PDF
    let listTagihanBelumDibaca = [];
    let activeBayarId = null;
    let activeTotal = 0;
    let activeDibayar = 0;
    let activeRiwayat = [];

    // Helper Format Rupiah
    function formatRupiah(angka) {
        if (!angka && angka !== 0) return "0";
        let number_string = Math.round(angka).toString().replace(/[^,\d]/g, ""),
            split = number_string.split(","),
            sisa = split[0].length % 3,
            rupiah = split[0].substr(0, sisa),
            ribuan = split[0].substr(sisa).match(/\d{3}/gi);

        if (ribuan) {
            let separator = sisa ? "." : "";
            rupiah += separator + ribuan.join(".");
        }
        return rupiah || "0";
    }

    // Input Auto Format Rupiah
    const inputNominal = document.getElementById("nominalBayarKasir");
    if (inputNominal) {
        inputNominal.addEventListener("keyup", function() {
            this.value = formatRupiah(this.value);
        });
    }

    // Listener Realtime Tagihan Kasir
    const dbRef = ref(db, 'invoiceBBS/transaksi');
    onValue(dbRef, (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById("containerTagihan");
        container.innerHTML = "";
        listTagihanBelumDibaca = [];
        semuaTagihanAktif = [];

        if (data) {
            Object.entries(data).forEach(([id, item]) => {
                // Filter: Hanya tampilkan tipe tagihan yang belum lunas (sisa > 0)
                if (item.tipe === 'tagihan' && item.sisa > 0) {
                    semuaTagihanAktif.push({ id, ...item });

                    if (item.dibacaKasir === false) {
                        listTagihanBelumDibaca.push({ id, ...item });
                    }

                    let riwayatJson = item.riwayat ? JSON.stringify(item.riwayat).replace(/"/g, '&quot;') : '[]';

                    let tombolAksi = "";
                    if (item.status === "Menunggu Konfirmasi") {
                        tombolAksi = `<span class="badge-pending-full">⏳ MENUNGGU KONFIRMASI (Rp ${formatRupiah(item.nominalPengajuanKasir)})</span>`;
                    } else {
                        tombolAksi = `<button class="btn-bayar-full" onclick="bukaBayarModal('${id}', '${item.keterangan.replace(/'/g, "\\'")}', ${item.total}, ${item.dibayar}, ${riwayatJson})">BAYAR</button>`;
                    }

                    const cardRow = `
                    <div class="card-tagihan">
                        <div class="card-row-tanggal">
                            📅 ${formatTanggalIndo(item.tanggal)}
                        </div>
                        <div class="card-row-rincian">
                            <b>${item.keterangan}</b>
                        </div>
                        <div class="card-row-totalan">
                            <div class="item-nominal">Total Tagihan: <b>Rp ${formatRupiah(item.total)}</b></div>
                            <div class="item-nominal text-sisa">Sisa Tagihan: <b>Rp ${formatRupiah(item.sisa)}</b></div>
                        </div>
                        <div class="card-row-aksi">
                            ${tombolAksi}
                        </div>
                    </div>`;

                    container.innerHTML += cardRow;
                }
            });

            if (container.innerHTML === "") {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: white;">Semua tagihan sudah lunas.</div>`;
            }
        } else {
            container.innerHTML = `<div style="text-align:center; padding: 20px; color: white;">Tidak ada data tagihan.</div>`;
        }

        if (listTagihanBelumDibaca.length > 0) {
            tampilkanPopUpTagihanBaru();
        }
    });

    // ==========================================
    // FITUR MODAL & DOWNLOAD PDF BERDASARKAN TANGGAL
    // ==========================================
    window.bukaModalPDF = function() {
        // Set default tanggal: tanggal 1 bulan ini s/d hari ini
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');

        if (!document.getElementById("pdfTglMulai").value) {
            document.getElementById("pdfTglMulai").value = `${yyyy}-${mm}-01`;
        }
        if (!document.getElementById("pdfTglAkhir").value) {
            document.getElementById("pdfTglAkhir").value = `${yyyy}-${mm}-${dd}`;
        }

        document.getElementById("modalDownloadPDF").style.display = "block";
    }

    window.tutupModalPDF = function() {
        document.getElementById("modalDownloadPDF").style.display = "none";
    }

    // Helper konversi string tanggal database ke format YYYY-MM-DD agar akurat saat difilter
    function normalisasiTanggalYYYYMMDD(tglStr) {
        if (!tglStr) return "";
        // Jika sudah format YYYY-MM-DD
        if (/^\d{4}-\d{2}-\d{2}$/.test(tglStr.trim())) {
            return tglStr.trim();
        }
        // Jika format DD/MM/YYYY atau D/M/YYYY
        if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(tglStr.trim())) {
            const parts = tglStr.trim().split('/');
            return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        }
        // Fallback parsing Date standar
        const d = new Date(tglStr);
        if (!isNaN(d.getTime())) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }
        return "";
    }

    // Format Tanggal Panjang untuk Judul PDF (Contoh: 1 November 2026)
    function formatTanggalPanjang(yyyy_mm_dd) {
        if (!yyyy_mm_dd) return "-";
        const [y, m, d] = yyyy_mm_dd.split('-');
        const namaBulan = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni",
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];
        return `${parseInt(d, 10)} ${namaBulan[parseInt(m, 10) - 1]} ${y}`;
    }

    window.generatePDFTagihan = function() {
        const tglMulai = document.getElementById("pdfTglMulai").value;
        const tglAkhir = document.getElementById("pdfTglAkhir").value;

        if (!tglMulai || !tglAkhir) {
            return alert("Silakan pilih tanggal mulai dan tanggal akhir terlebih dahulu!");
        }
        if (tglMulai > tglAkhir) {
            return alert("Tanggal mulai tidak boleh lebih besar dari tanggal akhir!");
        }

        // Filter tagihan sesuai rentang tanggal
        const dataTerfilter = semuaTagihanAktif
            .filter(item => {
                const tglItem = normalisasiTanggalYYYYMMDD(item.tanggal);
                return tglItem >= tglMulai && tglItem <= tglAkhir;
            })
            .sort((a, b) => {
                // Urutkan dari tanggal paling awal ke terbaru
                return normalisasiTanggalYYYYMMDD(a.tanggal).localeCompare(normalisasiTanggalYYYYMMDD(b.tanggal));
            });

        if (dataTerfilter.length === 0) {
            return alert(`Tidak ada tagihan yang belum dibayar pada periode ${formatTanggalPanjang(tglMulai)} s/d ${formatTanggalPanjang(tglAkhir)}.`);
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');

        // --- KOP / JUDUL DOKUMEN ---
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text("PT. BERKAH BAJA STEEL", 14, 18);

        doc.setFontSize(11);
        doc.text("DAFTAR TAGIHAN YANG HARUS DIBAYAR", 14, 25);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(`Periode Tanggal : ${formatTanggalPanjang(tglMulai)} s/d ${formatTanggalPanjang(tglAkhir)}`, 14, 32);

        // Garis pemisah kop
        doc.setLineWidth(0.5);
        doc.line(14, 36, 196, 36);

        // --- PERSIAPAN DATA TABEL ---
        let totalHarusDibayar = 0;
        const rows = dataTerfilter.map((item, index) => {
            const sisaTagihan = Number(item.sisa) || 0;
            totalHarusDibayar += sisaTagihan;

            return [
                index + 1,
                formatTanggalIndo(item.tanggal),
                item.keterangan || "-",
                `Rp ${formatRupiah(item.total)}`,
                `Rp ${formatRupiah(item.dibayar || 0)}`,
                `Rp ${formatRupiah(sisaTagihan)}`
            ];
        });

        // --- RENDER TABEL ---
        doc.autoTable({
            startY: 41,
            head: [['No', 'Hari & Tanggal', 'Rincian Tagihan', 'Total Tagihan', 'Sudah Dibayar', 'Sisa Tagihan']],
            body: rows,
            theme: 'grid',
            styles: {
                fontSize: 9,
                cellPadding: 3,
                valign: 'middle'
            },
            headStyles: {
                fillColor: [0, 156, 180],
                textColor: [255, 255, 255],
                fontStyle: 'bold',
                halign: 'center'
            },
            columnStyles: {
                0: { halign: 'center', cellWidth: 10 },
                1: { cellWidth: 34 },
                2: { cellWidth: 'auto' },
                3: { halign: 'right', cellWidth: 28 },
                4: { halign: 'right', cellWidth: 28 },
                5: { halign: 'right', cellWidth: 30, fontStyle: 'bold' }
            }
        });

        let finalY = doc.lastAutoTable.finalY + 8;

        // Cek jika ruang bawah halaman tidak cukup untuk total + TTD
        if (finalY + 60 > 285) {
            doc.addPage();
            finalY = 20;
        }

        // --- KOTAK TOTAL JUMLAH YANG HARUS DIBAYAR ---
        doc.setFillColor(255, 243, 243);
        doc.setDrawColor(213, 0, 0);
        doc.setLineWidth(0.4);
        doc.rect(14, finalY, 182, 12, 'FD');

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(0, 0, 0);
        doc.text("TOTAL JUMLAH YANG HARUS DIBAYAR :", 18, finalY + 8);

        doc.setTextColor(213, 0, 0);
        doc.text(`Rp ${formatRupiah(totalHarusDibayar)}`, 192, finalY + 8, { align: "right" });

        // --- BAGIAN TANDA TANGAN (KANAN BAWAH) ---
        doc.setTextColor(0, 0, 0);
        let ttdY = finalY + 25;
        let centerX = 160; // Titik tengah area TTD di sisi kanan

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text("Hormat kami,", centerX, ttdY, { align: "center" });

        // Ruang kosong untuk tanda tangan (24 mm)
        let namaY = ttdY + 26;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        const namaTTD = "Alif Alfasya Fawwaz";
        doc.text(namaTTD, centerX, namaY, { align: "center" });

        // Garis bawah nama
        const textWidth = doc.getTextWidth(namaTTD);
        doc.setLineWidth(0.3);
        doc.line(centerX - (textWidth / 2), namaY + 1.2, centerX + (textWidth / 2), namaY + 1.2);

        // Jabatan
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9.5);
        doc.text("KEUANGAN PT. BBS", centerX, namaY + 6, { align: "center" });

        // Simpan file PDF
        doc.save(`Tagihan_PT_BBS_${tglMulai}_sd_${tglAkhir}.pdf`);
        tutupModalPDF();
    }

    // Pop-up Tagihan Baru untuk Kasir
    function tampilkanPopUpTagihanBaru() {
        const container = document.getElementById("isiNotifTagihan");
        let htmlContent = "";
        
        listTagihanBelumDibaca.forEach((item, idx) => {
            htmlContent += `<div style="border-bottom:1px solid #ddd; padding:10px 0;">
                <b>#${idx + 1}. ${item.keterangan}</b><br>
                Tanggal: ${formatTanggalIndo(item.tanggal)}<br>
                Total Tagihan: <b style="color:#d50000;">Rp ${formatRupiah(item.total)}</b>
            </div>`;
        });

        container.innerHTML = htmlContent;
        container.scrollTop = 0;
        document.getElementById("popTagihanBaru").style.display = "block";
    }

    // Konfirmasi Pembacaan Tagihan Baru
    window.konfirmasiBacaTagihan = function() {
        listTagihanBelumDibaca.forEach(item => {
            const itemRef = ref(db, 'invoiceBBS/transaksi/' + item.id);
            update(itemRef, { dibacaKasir: true });
        });
        document.getElementById("popTagihanBaru").style.display = "none";
    }

    // Buka Modal Bayar Kasir
    window.bukaBayarModal = function(id, keterangan, total, dibayar, riwayatLama) {
        activeBayarId = id;
        activeTotal = total;
        activeDibayar = dibayar;
        activeRiwayat = riwayatLama ? Object.values(riwayatLama) : [];

        document.getElementById("infoDetailTagihan").innerHTML = `
            <b>Tagihan:</b> ${keterangan}<br>
            <b>Total Tagihan:</b> Rp ${formatRupiah(total)}<br>
            <b>Sisa Tagihan:</b> <span style="color:red; font-weight:bold;">Rp ${formatRupiah(total - dibayar)}</span>
        `;
        document.getElementById("nominalBayarKasir").value = "";
        document.getElementById("modalBayarKasir").style.display = "block";
    }

    // Tutup Modal Bayar
    window.tutupBayarModal = function() {
        document.getElementById("modalBayarKasir").style.display = "none";
    }

    // Kirim Pengajuan Pembayaran ke Manager
    window.prosesBayarKasir = function() {
        let nominalStr = document.getElementById("nominalBayarKasir").value;
        let nominal = parseFloat(nominalStr.replace(/\./g, '').replace(/[^0-9]/g, '')) || 0;
        let sisaSekarang = activeTotal - activeDibayar;

        if (nominal <= 0) return alert("Masukkan nominal yang valid!");
        if (nominal > sisaSekarang) return alert("Nominal pembayaran melebihi sisa tagihan!");

        const itemRef = ref(db, 'invoiceBBS/transaksi/' + activeBayarId);
        update(itemRef, {
            nominalPengajuanKasir: nominal,
            status: "Menunggu Konfirmasi",
            notifAdminDilihat: false
        }).then(() => {
            alert("Pengajuan pembayaran berhasil dikirim! Menunggu konfirmasi Manager.");
            tutupBayarModal();
        }).catch((err) => {
            alert("Gagal mengirim pengajuan: " + err.message);
        });
    }

    // Helper Format Hari & Tanggal
    function formatTanggalIndo(tglString) {
        if (!tglString) return "-";
        const date = new Date(tglString);
        if (isNaN(date.getTime())) return tglString;

        const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const hari = namaHari[date.getDay()];
        const tgl = date.getDate();
        const bulan = date.getMonth() + 1;
        const tahun = date.getFullYear();

        return `${hari}, ${tgl}/${bulan}/${tahun}`;
    }
